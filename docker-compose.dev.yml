services:

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: webnettest-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    restart: unless-stopped

    networks:
      - backend-webnet
networks:
  backend-webnet:
    external: true